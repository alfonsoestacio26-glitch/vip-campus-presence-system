# Render Blueprint Specification for Laravel + Vite
services:
  - type: web
    name: vip-campus-presence-system
    runtime: php
    buildCommand: "./render-build.sh"
    startCommand: "vendor/bin/heroku-php-apache2 public/"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
