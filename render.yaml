# Render Blueprint Specification for Laravel + Vite (Docker)
services:
  - type: web
    name: vip-campus-presence-system
    runtime: docker
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
